# Benchmark : même déploiement, configuré de façon sûre (aucune alerte attendue).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boutique
spec:
  replicas: 2
  selector:
    matchLabels:
      app: boutique
  template:
    metadata:
      labels:
        app: boutique
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: acme/boutique:1.4.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: "500m"
              memory: 512Mi
