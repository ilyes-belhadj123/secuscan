[project]
name = "secuscan-api"
version = "0.1.0"
description = "SecuScan — API d'analyse de sécurité du code assistée par IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-java>=0.23.5",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
    "cryptography>=50.0.1",
    "bandit>=1.9.4",
    "defusedxml>=0.7.1",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-go>=0.23",
    # Pillow (logos réencodés, PDF) : version corrigée en production (Linux). Sur un poste Windows avec
    # Smart App Control, la DLL de Pillow 13 encore trop récente est bloquée : version précédente en local
    # uniquement, où seuls les logos de l'équipe sont traités. À retirer dès que Windows l'accepte.
    "pillow>=13.0.0; sys_platform != 'win32'",
    "pillow>=12.3,<13; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 : Depends()/File() en valeur par défaut est l'idiome FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
