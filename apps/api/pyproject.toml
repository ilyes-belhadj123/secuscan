[project]
name = "secuscan-api"
version = "0.1.0"
description = "SecuScan — API d'analyse de sécurité du code assistée par IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "reportlab>=4.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-java>=0.23.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 125
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008 : Depends()/File() en valeur par défaut est l'idiome FastAPI
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
